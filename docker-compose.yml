version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: web
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "
        echo '⌛ wait mysql...'; \
        for i in {1..60}; do \
          nc -z \$${DB_HOST} \$${DB_PORT} && break; \
          echo '... retry' \$i; \
          sleep 1; \
        done && \
        python manage.py migrate && \
        python manage.py collectstatic --noinput && \
        gunicorn project.wsgi:application --bind 0.0.0.0:8080 --workers 3
      "

volumes:
  db_data:
