services:
  db:
    image: postgres:16
    container_name: pgdb
    environment:
      TZ: Asia/Bangkok
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"  # ถ้าจะต่อ DB จากภายนอก: host 5433 -> container 5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    container_name: web
    env_file:
      - .env
    environment:
      TZ: Asia/Bangkok
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"  # ให้บริการบน 202.28.49.122:8080
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c '
        echo "⏳ waiting for postgres at ${DB_HOST:-db}:${DB_PORT:-5432} ...";
        i=0; until nc -z "${DB_HOST:-db}" "${DB_PORT:-5432}"; do
          i=$$((i+1)); [ $$i -ge 60 ] && echo "❌ DB not ready in 60s" && exit 1;
          echo "... retry $$i"; sleep 1;
        done;
        python manage.py migrate --noinput || exit 1;
        python manage.py collectstatic --noinput || true;
        exec gunicorn project.wsgi:application \
          --bind 0.0.0.0:8080 \
          --workers ${GUNICORN_WORKERS:-3} \
          --timeout ${GUNICORN_TIMEOUT:-60} \
          --max-requests ${GUNICORN_MAX_REQUESTS:-1000} \
          --max-requests-jitter ${GUNICORN_MAX_REQUESTS_JITTER:-50}
      '

volumes:
  pg_data: {}
