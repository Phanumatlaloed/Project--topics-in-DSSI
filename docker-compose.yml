services:
  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "mydata85"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: web
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
    ports:
      - "8080:8080"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    command: ["/entrypoint.sh"]

volumes:
  db_data:
