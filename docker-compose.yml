version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      # ถ้าใช้ root ใน Django ไม่จำเป็นต้องตั้ง MYSQL_USER/MYSQL_PASSWORD เพิ่ม
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3307:3306"   # ภายนอกใช้ 3307, ภายในคอนเทนเนอร์ยังเป็น 3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    build: .
    container_name: web
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # โหมด prod: เมาต์เฉพาะโฟลเดอร์ผลลัพธ์
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      # ถ้าจะ dev ให้เมาต์โค้ดทั้งโปรเจกต์แทน: - .:/app
    depends_on:
      db:
        condition: service_healthy
    # รอ DB -> migrate -> collectstatic -> รัน gunicorn (ไม่มี entrypoint.sh)
    command: >
      sh -c '
        echo "⏳ waiting for mysql at ${DB_HOST:-db}:${DB_PORT:-3306} ...";
        i=0; until nc -z "${DB_HOST:-db}" "${DB_PORT:-3306}"; do
          i=$$((i+1)); [ $$i -ge 60 ] && echo "❌ DB not ready in 60s" && exit 1;
          echo "... retry $$i"; sleep 1;
        done;
        python manage.py migrate --noinput || exit 1;
        python manage.py collectstatic --noinput || true;
        exec gunicorn project.wsgi:application --bind 0.0.0.0:8080 --workers 3
      '

volumes:
  db_data:
